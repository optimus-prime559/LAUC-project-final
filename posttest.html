<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Posttest – Heat Conduction</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f8ff;
    color:#1f2937;
}
header{
    background:#1e3a8a;
    color:white;
    padding:14px 20px;
}
.container{
    max-width:800px;
    margin:auto;
    padding:30px 20px;
}
.question{
    background:#ffffff;
    padding:20px;
    border-radius:12px;
    margin-bottom:18px;
    box-shadow:0 6px 14px rgba(0,0,0,0.1);
    display:none;
}
.question.active{
    display:block;
}
.option{ margin:8px 0; }

button{
    background:#1e3a8a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

.correct{
    background:#e6f7ef;
    border-left:5px solid #22c55e;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}
.incorrect{
    background:#fdecea;
    border-left:5px solid #ef4444;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}
.sim-btn{
    background:#f59e0b;
    margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>Heat Conduction Posttest</h1>
</header>

<div class="container">

<!-- Q1 -->
<div class="question active" id="q1">
<h3>1. Calculate heat transfer rate (steel pipe)</h3>
<label><input type="radio" name="q1" value="A"> 1.4 MW</label><br>
<label><input type="radio" name="q1" value="B"> 0.7 MW</label><br>
<label><input type="radio" name="q1" value="C"> 2.8 MW</label><br>
<label><input type="radio" name="q1" value="D"> 5.6 kW</label><br>

<button onclick="checkAnswer(1)">Submit</button>
<div id="res1"></div>
</div>

<!-- Q2 -->
<div class="question" id="q2">
<h3>2. Heat loss in insulated pipe</h3>
<label><input type="radio" name="q2" value="A"> 95.3</label><br>
<label><input type="radio" name="q2" value="B"> 286</label><br>
<label><input type="radio" name="q2" value="C"> 572</label><br>
<label><input type="radio" name="q2" value="D"> 1144</label><br>

<button onclick="checkAnswer(2)">Submit</button>
<div id="res2"></div>
</div>

<!-- Q3 -->
<div class="question" id="q3">
<h3>3. Copper pipe heat loss</h3>
<label><input type="radio" name="q3" value="A"> 175 kW</label><br>
<label><input type="radio" name="q3" value="B"> 17.5 kW</label><br>
<label><input type="radio" name="q3" value="C"> 175 W</label><br>
<label><input type="radio" name="q3" value="D"> 1.75 MW</label><br>

<button onclick="checkAnswer(3)">Submit</button>
<div id="res3"></div>
</div>

<!-- Q4 -->
<div class="question" id="q4">
<h3>4. Insulated steel pipe heat loss</h3>
<label><input type="radio" name="q4" value="A"> 125</label><br>
<label><input type="radio" name="q4" value="B"> 250</label><br>
<label><input type="radio" name="q4" value="C"> 500</label><br>
<label><input type="radio" name="q4" value="D"> 1000</label><br>

<button onclick="checkAnswer(4)">Submit</button>
<div id="res4"></div>
</div>

</div>

<script>

const answers = {
    1:"A",
    2:"B",
    3:"B",
    4:"B"
};

/* 🔥 PARAMETERS FOR SIMULATION AUTO-FILL */
const simData = {
1:"simulation.html?r1=0.05&r2=0.07&k=50&T1=200&T2=50&L=10",
2:"simulation.html?r1=0.04&r2=0.08&k=0.05&T1=150&T2=40&L=1",
3:"simulation.html?r1=0.025&r2=0.035&k=400&T1=90&T2=70&L=1",
4:"simulation.html?r1=0.03&r2=0.09&k=0.1&T1=200&T2=30&L=1"
};

function checkAnswer(q){

let selected = document.querySelector(`input[name="q${q}"]:checked`);
let res = document.getElementById("res"+q);

if(!selected){
    alert("Select an option first!");
    return;
}

if(selected.value === answers[q]){
    res.innerHTML = `<div class="correct">Correct ✅</div>`;
    nextQuestion(q);
}
else{
    res.innerHTML = `
    <div class="incorrect">
    Incorrect ❌<br>
    <b>Correct Answer:</b> ${answers[q]}<br><br>

    <button class="sim-btn" onclick="goToSimulation(${q})">
    Go to Simulation 🔬
    </button>
    </div>`;
}

}

function nextQuestion(q){
document.getElementById("q"+q).classList.remove("active");
if(q < 4){
    document.getElementById("q"+(q+1)).classList.add("active");
}
else{
    alert("Test Completed 🎉");
}
}

/* 🚀 REDIRECT WITH VALUES */
function goToSimulation(q){
    window.location.href = simData[q];
}

</script>

</body>
</html>
